version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - carsharing_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - carsharing_network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A Carshering worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - carsharing_network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A Carshering beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - carsharing_network

volumes:
  static_volume:
  media_volume:
  redis_data:

networks:
  carsharing_network:
    driver: bridge

